<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Συντονιστής Πρεσβυτερίου</title><style>:root{font-family:system-ui,Arial;background:#f4f6fa;color:#17233b}*{box-sizing:border-box}body{margin:0}header{background:#23395d;color:white;padding:20px 28px}header h1{margin:0;font-size:24px}header small{opacity:.8}nav{display:flex;gap:8px;flex-wrap:wrap;background:white;padding:12px 22px;border-bottom:1px solid #ddd}button{border:0;border-radius:9px;padding:10px 15px;cursor:pointer;background:#e7ecf5;color:#1c355b}button.active,button.primary{background:#315b93;color:white}main{max-width:1100px;margin:25px auto;padding:0 16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card,.panel{background:white;border:1px solid #e3e7ef;border-radius:13px;padding:20px;margin-bottom:18px;box-shadow:0 3px 12px #14223a08}.metric{font-size:30px;font-weight:700;margin-top:9px}h2{margin-top:0}form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-bottom:18px}input,select,textarea{width:100%;padding:11px;border:1px solid #cdd5e1;border-radius:8px;font:inherit}textarea{min-height:85px;grid-column:1/-1}form button{justify-self:start}table{width:100%;border-collapse:collapse}td,th{padding:12px;text-align:left;border-bottom:1px solid #edf0f5}th{color:#53617b;font-size:13px}td button{margin:2px}.muted{color:#67758b}.hide{display:none}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.pill{display:inline-block;background:#e7effb;padding:5px 9px;border-radius:20px;font-size:12px}@media(max-width:650px){table{display:block;overflow-x:auto}header h1{font-size:20px}}#authArea{max-width:560px;margin:24px auto;padding:20px;background:white;border-radius:14px;border:1px solid #ddd}#authArea input{margin:6px 0 12px}#syncBar{padding:10px 22px;background:#e8f1fc;font-size:13px}#syncBar button{margin-left:12px}body.locked nav,body.locked main{display:none}</style></head><body><header><h1>Συντονιστής Πρεσβυτερίου</h1><small>Οργάνωση • Συνεργασία • Παρακολούθηση</small></header><div id="syncBar">Αποσυνδεδεμένο</div><div id="authArea"></div><nav id="nav"></nav><main id="content"></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const tabs=['Επισκόπηση','Συνεδριάσεις','Αναθέσεις','Επισκέψεις','Ημερολόγιο','Ανακοινώσεις','Επιτροπή Εκκλησίας','Συνδεδεμένες σελίδες','Αναφορές'];let current=0;const key='presbyterium_v1';let db;try{db=JSON.parse(localStorage.getItem(key))||{meetings:[],tasks:[],visits:[]}}catch{db={meetings:[],tasks:[],visits:[]}};if(!Array.isArray(db.announcements))db.announcements=[];if(!Array.isArray(db.committeeTopics))db.committeeTopics=[];if(!Array.isArray(db.committeeSchedules))db.committeeSchedules=[];if(!db.links)db.links={deadlines:'',publicTalks:'https://publictalks.onrender.com/'};const save=()=>{localStorage.setItem(key,JSON.stringify(db));queueCloudSave()};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=s=>s?new Date(s+'T12:00:00').toLocaleDateString('el-GR'):'—';const fmt=s=>esc(s||'—');function nav(){document.getElementById('nav').innerHTML=tabs.map((t,i)=>`<button class="${i===current?'active':''}" onclick="go(${i})">${t}</button>`).join('')}function go(i){current=i;render()}function remove(type,id){if(confirm('Να διαγραφεί η καταχώριση;')){db[type]=db[type].filter(x=>x.id!==id);save();render()}}function toggle(id){let t=db.tasks.find(x=>x.id===id);if(t){t.done=!t.done;save();render()}}function add(type,form){const d=new FormData(form);let x={id:Date.now(),...Object.fromEntries(d.entries())};if(type==='tasks')x.done=false;if(type==='announcements')x.published=false;if(type==='committeeTopics')x.status='Προς συζήτηση';db[type].push(x);save();render();return false}function editEntry(type,id){
 const entry=db[type].find(x=>String(x.id)===String(id));if(!entry)return;
 const fields=type==='meetings'?['title','date','agenda','decision']:['title','owner','due','priority'];
 const labels={title:'Τίτλος / περιγραφή',date:'Ημερομηνία',agenda:'Ημερήσια διάταξη',decision:'Αποφάσεις',owner:'Υπεύθυνος',due:'Προθεσμία',priority:'Προτεραιότητα'};
 const form=document.createElement('form');form.id='editEntryForm';form.style.cssText='display:grid;grid-template-columns:1fr;gap:10px';
 fields.forEach(k=>{const label=document.createElement('label');label.textContent=labels[k];const input=(k==='agenda'||k==='decision')?document.createElement('textarea'):k==='priority'?document.createElement('select'):document.createElement('input');input.name=k;if(k==='date'||k==='due')input.type='date';if(k==='priority'){['Κανονική','Υψηλή','Χαμηλή'].forEach(v=>{const opt=document.createElement('option');opt.value=v;opt.textContent=v;input.appendChild(opt)})}input.value=entry[k]||'';if(k==='title'||k==='owner'||k==='date'||k==='due')input.required=true;label.appendChild(input);form.appendChild(label)});
 const actions=document.createElement('div');actions.className='row';const saveBtn=document.createElement('button');saveBtn.className='primary';saveBtn.textContent='Αποθήκευση διορθώσεων';saveBtn.type='submit';const cancelBtn=document.createElement('button');cancelBtn.type='button';cancelBtn.textContent='Ακύρωση';cancelBtn.onclick=()=>render();actions.append(saveBtn,cancelBtn);form.appendChild(actions);
 form.onsubmit=e=>{e.preventDefault();const values=Object.fromEntries(new FormData(form));Object.assign(entry,values);save();render()};
 const panel=document.createElement('section');panel.className='panel';const heading=document.createElement('h2');heading.textContent='Διόρθωση '+(type==='meetings'?'συνεδρίασης':'ανάθεσης');panel.append(heading,form);const main=document.getElementById('content');main.prepend(panel);panel.scrollIntoView({behavior:'smooth',block:'start'});
}
function addSuggestedTopic(){const input=document.getElementById('suggestedTopic');if(!input||!input.value)return;const agenda=document.querySelector('form[onsubmit*="meetings"] textarea[name="agenda"]');if(!agenda)return;agenda.value+=(agenda.value.trim()?'\n':'')+'• '+input.value;input.value='';}
function copyAnnouncement(id){const a=db.announcements.find(x=>x.id===id);if(!a)return;const msg=[a.title,a.body,a.date?'Ημερομηνία: '+date(a.date):''].filter(Boolean).join('\n\n');navigator.clipboard?.writeText(msg).then(()=>alert('Η ανακοίνωση αντιγράφηκε.')).catch(()=>prompt('Αντίγραψε την ανακοίνωση:',msg))}function toggleAnnouncement(id){const a=db.announcements.find(x=>x.id===id);if(a){a.published=!a.published;save();render()}}function setTopicStatus(id,status){const t=db.committeeTopics.find(x=>x.id===id);if(t){t.status=status;save();render()}}function nextOccurrence(item){const start=new Date(item.start+'T12:00:00');if(isNaN(start))return '—';const today=new Date();today.setHours(0,0,0,0);let d=new Date(start);if(item.frequency==='Εβδομαδιαία'){while(d<today)d.setDate(d.getDate()+7)}else if(item.frequency==='Κάθε 2 εβδομάδες'){while(d<today)d.setDate(d.getDate()+14)}else if(item.frequency==='Μηνιαία'){let day=start.getDate();while(d<today){d.setDate(1);d.setMonth(d.getMonth()+1);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}}else if(d<today)return 'Παρήλθε';return d.toLocaleDateString('el-GR')}function saveLinks(form){const d=new FormData(form);for(const name of ['deadlines','publicTalks']){const value=String(d.get(name)||'').trim();if(value){try{const u=new URL(value);if(u.protocol!=='https:')throw Error()}catch{alert('Χρειάζεται έγκυρος σύνδεσμος HTTPS.');return false}}db.links[name]=value}save();render();return false}function table(headers,rows){return `<div style="overflow-x:auto"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}" class="muted">Δεν υπάρχουν καταχωρίσεις ακόμη.</td></tr>`}</tbody></table></div>`}function render(){nav();let h='';if(current===0){let pending=db.tasks.filter(t=>!t.done).length;h=`<h2>Πίνακας ελέγχου</h2><div class="cards"><div class="card">Εκκρεμείς αναθέσεις<div class="metric">${pending}</div></div><div class="card">Συνεδριάσεις<div class="metric">${db.meetings.length}</div></div><div class="card">Προγραμματισμένες επισκέψεις<div class="metric">${db.visits.length}</div></div><div class="card">Ολοκληρωμένες εργασίες<div class="metric">${db.tasks.filter(t=>t.done).length}</div></div></div><section class="panel"><h2>Επόμενες ενέργειες</h2>${table(['Εργασία','Υπεύθυνος','Προθεσμία'],db.tasks.filter(t=>!t.done).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,8).map(t=>`<tr><td>${esc(t.title)}</td><td>${fmt(t.owner)}</td><td>${date(t.due)}</td></tr>`))}</section>`}if(current===1){h=`<section class="panel"><h2>Νέα συνεδρίαση</h2><div class="topic-picker"><label for="suggestedTopic">Προτεινόμενα θέματα ημερήσιας διάταξης</label><div class="row"><select id="suggestedTopic"><option value="">Επίλεξε θέμα</option><option>Υπηρεσία αγρού και οργάνωση τομέων</option><option>Δράση και υποστήριξη σκαπανέων</option><option>Ποιμαντική φροντίδα (χωρίς ευαίσθητα στοιχεία)</option><option>Πρόγραμμα συναθροίσεων και αναθέσεις</option><option>Ανακοινώσεις εκκλησίας</option><option>Πρακτικές διευθετήσεις και συντήρηση</option><option>Εκπαίδευση και συνεργασία αδελφών</option><option>Εκκρεμότητες προηγούμενης συνεδρίασης</option></select><button type="button" onclick="addSuggestedTopic()">Προσθήκη στην ημερήσια διάταξη</button></div></div><form onsubmit="return add('meetings',this)"><input name="title" placeholder="Θέμα / τίτλος" required><input name="date" type="date" required><textarea name="agenda" placeholder="Ημερήσια διάταξη (χωρίς εμπιστευτικές λεπτομέρειες)"></textarea><textarea name="decision" placeholder="Αποφάσεις / επόμενες ενέργειες"></textarea><button class="primary">Προσθήκη</button></form></section><section class="panel"><h2>Συνεδριάσεις</h2>${table(['Ημερομηνία','Θέμα','Ημερήσια διάταξη','Αποφάσεις',''],db.meetings.map(m=>`<tr><td>${date(m.date)}</td><td>${esc(m.title)}</td><td>${fmt(m.agenda)}</td><td>${fmt(m.decision)}</td><td><button onclick="editEntry('meetings',${m.id})">Διόρθωση</button> <button onclick="remove('meetings',${m.id})">Διαγραφή</button></td></tr>`))}</section>`}if(current===2){h=`<section class="panel"><h2>Νέα ανάθεση</h2><form onsubmit="return add('tasks',this)"><input name="title" placeholder="Περιγραφή εργασίας" required><input name="owner" placeholder="Υπεύθυνος" required><input name="due" type="date" required><select name="priority"><option>Κανονική</option><option>Υψηλή</option><option>Χαμηλή</option></select><button class="primary">Προσθήκη</button></form></section><section class="panel"><h2>Αναθέσεις</h2>${table(['Εργασία','Υπεύθυνος','Προθεσμία','Προτεραιότητα','Κατάσταση',''],db.tasks.map(t=>`<tr><td>${esc(t.title)}</td><td>${esc(t.owner)}</td><td>${date(t.due)}</td><td>${esc(t.priority)}</td><td><button onclick="toggle(${t.id})">${t.done?'✓ Ολοκληρώθηκε':'Εκκρεμεί'}</button></td><td><button onclick="editEntry('tasks',${t.id})">Διόρθωση</button> <button onclick="remove('tasks',${t.id})">Διαγραφή</button></td></tr>`))}</section>`}if(current===3){h=`<section class="panel"><h2>Προγραμματισμός ποιμαντικής επίσκεψης</h2><p class="muted">Καταχώρισε μόνο τα απολύτως απαραίτητα στοιχεία. Απόφυγε προσωπικές ή ευαίσθητες σημειώσεις.</p><form onsubmit="return add('visits',this)"><input name="label" placeholder="Κωδικός ή γενική περιγραφή" required><input name="elders" placeholder="Πρεσβύτεροι" required><input name="date" type="date" required><select name="status"><option>Προγραμματισμένη</option><option>Ολοκληρωμένη</option></select><button class="primary">Προσθήκη</button></form></section><section class="panel"><h2>Επισκέψεις</h2>${table(['Περιγραφή','Πρεσβύτεροι','Ημερομηνία','Κατάσταση',''],db.visits.map(v=>`<tr><td>${esc(v.label)}</td><td>${esc(v.elders)}</td><td>${date(v.date)}</td><td>${esc(v.status)}</td><td><button onclick="remove('visits',${v.id})">Διαγραφή</button></td></tr>`))}</section>`}if(current===4){let events=[...db.meetings.map(x=>({date:x.date,type:'Συνεδρίαση',title:x.title})),...db.visits.map(x=>({date:x.date,type:'Επίσκεψη',title:x.label})),...db.tasks.map(x=>({date:x.due,type:'Προθεσμία',title:x.title}))].sort((a,b)=>a.date.localeCompare(b.date));h=`<section class="panel"><h2>Ημερολόγιο ενεργειών</h2>${table(['Ημερομηνία','Κατηγορία','Περιγραφή'],events.map(e=>`<tr><td>${date(e.date)}</td><td><span class="pill">${e.type}</span></td><td>${esc(e.title)}</td></tr>`))}</section>`}if(current===5){h=`<section class="panel"><h2>Νέα ανακοίνωση εκκλησίας</h2><p class="muted">Προετοιμασία ανακοινώσεων για τις συναθροίσεις. Η ένδειξη «Έτοιμη» είναι εσωτερική και δεν δημοσιεύει την ανακοίνωση στο διαδίκτυο.</p><form onsubmit="return add('announcements',this)"><input name="title" placeholder="Τίτλος ανακοίνωσης" required><input name="date" type="date" required><select name="category"><option>Γενική</option><option>Συνάθροιση</option><option>Υπηρεσία αγρού</option><option>Πρακτικές διευθετήσεις</option><option>Άλλη</option></select><textarea name="body" placeholder="Κείμενο ανακοίνωσης" required></textarea><button class="primary">Αποθήκευση προσχεδίου</button></form></section><section class="panel"><h2>Ανακοινώσεις</h2>${table(['Ημερομηνία','Κατηγορία','Ανακοίνωση','Κατάσταση','Ενέργειες'],[...db.announcements].sort((a,b)=>b.date.localeCompare(a.date)).map(a=>`<tr><td>${date(a.date)}</td><td>${esc(a.category)}</td><td><strong>${esc(a.title)}</strong><p style="white-space:pre-wrap">${esc(a.body)}</p></td><td>${a.published?'Έτοιμη':'Προσχέδιο'}</td><td><button onclick="toggleAnnouncement(${a.id})">${a.published?'Επιστροφή σε προσχέδιο':'Σήμανση έτοιμης'}</button><button onclick="copyAnnouncement(${a.id})">Αντιγραφή</button><button onclick="remove('announcements',${a.id})">Διαγραφή</button></td></tr>`))}</section>`}if(current===6){h=`<section class="panel"><h2>Επιτροπή Εκκλησίας — Θέματα προς συζήτηση</h2><p class="muted">Εσωτερικός προγραμματισμός θεμάτων, χωρίς καταχώριση εμπιστευτικών προσωπικών λεπτομερειών.</p><form onsubmit="return add('committeeTopics',this)"><input name="title" placeholder="Θέμα προς συζήτηση" required><select name="category"><option>Δράση σκαπανέων</option><option>Υπηρεσία αγρού</option><option>Συναθροίσεις</option><option>Πρακτικά ζητήματα</option><option>Άλλο</option></select><input name="owner" placeholder="Υπεύθυνος"><input name="date" type="date" aria-label="Προτεινόμενη ημερομηνία"><textarea name="notes" placeholder="Σημεία συζήτησης / επόμενες ενέργειες (όχι ευαίσθητα δεδομένα)"></textarea><button class="primary">Προσθήκη θέματος</button></form>${table(['Θέμα','Κατηγορία','Ημερομηνία','Υπεύθυνος','Κατάσταση','Ενέργειες'],db.committeeTopics.map(t=>`<tr><td><strong>${esc(t.title)}</strong><p class="muted" style="white-space:pre-wrap">${esc(t.notes)}</p></td><td>${esc(t.category)}</td><td>${date(t.date)}</td><td>${esc(t.owner)}</td><td>${esc(t.status)}</td><td><select aria-label="Κατάσταση θέματος" onchange="setTopicStatus(${t.id},this.value)">${['Προς συζήτηση','Σε εξέλιξη','Αποφασίστηκε','Ολοκληρώθηκε'].map(v=>`<option ${t.status===v?'selected':''}>${v}</option>`).join('')}</select><button onclick="remove('committeeTopics',${t.id})">Διαγραφή</button></td></tr>`))}</section><section class="panel"><h2>Τακτικές συναντήσεις και δράσεις</h2><p class="muted">Προγραμμάτισε επαναλαμβανόμενες συναντήσεις, όπως οργάνωση δράσης σκαπανέων. Οι ημερομηνίες υπολογίζονται τοπικά· δεν αποστέλλονται αυτόματες ειδοποιήσεις.</p><form onsubmit="return add('committeeSchedules',this)"><input name="title" placeholder="π.χ. Συνάντηση για δράση σκαπανέων" required><input name="start" type="date" required aria-label="Πρώτη ημερομηνία"><input name="time" type="time" required aria-label="Ώρα"><select name="frequency"><option>Εβδομαδιαία</option><option>Κάθε 2 εβδομάδες</option><option>Μηνιαία</option><option>Μία φορά</option></select><input name="place" placeholder="Χώρος ή σύνδεσμος"><input name="coordinator" placeholder="Υπεύθυνος συνάντησης"><textarea name="agenda" placeholder="Σταθερή ημερήσια διάταξη / σκοπός"></textarea><button class="primary">Προγραμματισμός</button></form>${table(['Συνάντηση','Επανάληψη','Επόμενη ημερομηνία','Ώρα','Στοιχεία','Ενέργειες'],db.committeeSchedules.map(t=>`<tr><td><strong>${esc(t.title)}</strong><p class="muted">${esc(t.agenda)}</p></td><td>${esc(t.frequency)}</td><td>${nextOccurrence(t)}</td><td>${esc(t.time)}</td><td>${esc(t.place)}<p>${esc(t.coordinator)}</p></td><td><button onclick="remove('committeeSchedules',${t.id})">Διαγραφή</button></td></tr>`))}</section>`}if(current===7){h=`<section class="panel"><h2>Συνδεδεμένες σελίδες</h2><p class="muted">Γρήγορη πρόσβαση στις εφαρμογές Deadlines και Public Talks. Οι σύνδεσμοι ανοίγουν σε νέα καρτέλα. Δεν γίνεται ανταλλαγή δεδομένων ή αυτόματος συγχρονισμός.</p><div class="cards"><div class="card"><h3>Deadlines — Προθεσμίες</h3><p>Άνοιγμα της εφαρμογής προθεσμιών.</p>${db.links.deadlines?`<a href="${esc(db.links.deadlines)}" target="_blank" rel="noopener noreferrer">Άνοιγμα Deadlines ↗</a>`:'<p class="muted">Δεν έχει οριστεί ακόμη διεύθυνση.</p>'}</div><div class="card"><h3>Public Talks — Δημόσιες Ομιλίες</h3><p>Πρόσβαση στο πρόγραμμα δημόσιων ομιλιών.</p>${db.links.publicTalks?`<a href="${esc(db.links.publicTalks)}" target="_blank" rel="noopener noreferrer">Άνοιγμα Public Talks ↗</a>`:'<p class="muted">Δεν έχει οριστεί διεύθυνση.</p>'}</div></div></section><section class="panel"><h2>Ρυθμίσεις συνδέσεων</h2><form onsubmit="return saveLinks(this)"><label>Διεύθυνση Deadlines<input type="url" name="deadlines" placeholder="https://..." value="${esc(db.links.deadlines)}"></label><label>Διεύθυνση Public Talks<input type="url" name="publicTalks" placeholder="https://..." value="${esc(db.links.publicTalks)}"></label><button class="primary">Αποθήκευση συνδέσμων</button></form></section>`}if(current===8){let n=db.tasks.length,done=db.tasks.filter(x=>x.done).length;h=`<section class="panel"><h2>Αναφορές</h2><p>Ποσοστό ολοκλήρωσης αναθέσεων: <strong>${n?Math.round(done/n*100):0}%</strong></p><p>Συνεδριάσεις: <strong>${db.meetings.length}</strong></p><p>Επισκέψεις: <strong>${db.visits.length}</strong></p><p>Ανακοινώσεις: <strong>${db.announcements.length}</strong></p><p>Θέματα επιτροπής: <strong>${db.committeeTopics.length}</strong></p><p>Τακτικές συναντήσεις: <strong>${db.committeeSchedules.length}</strong></p><button class="primary" onclick="exportData()">Εξαγωγή αντιγράφου JSON</button> <button onclick="importFile.click()">Εισαγωγή αντιγράφου</button><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(this)"></section>`}document.getElementById('content').innerHTML=h}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='presbyterium-backup.json';a.click();URL.revokeObjectURL(a.href)}async function importData(el){try{let obj=JSON.parse(await el.files[0].text());if(!['tasks','visits','meetings'].every(k=>Array.isArray(obj[k])))throw Error();if(confirm('Να αντικατασταθούν τα υπάρχοντα δεδομένα;')){db=obj;if(!Array.isArray(db.announcements))db.announcements=[];if(!Array.isArray(db.committeeTopics))db.committeeTopics=[];if(!Array.isArray(db.committeeSchedules))db.committeeSchedules=[];if(!db.links)db.links={deadlines:'',publicTalks:'https://publictalks.onrender.com/'};save();render()}}catch{alert('Μη έγκυρο αντίγραφο ασφαλείας')}}
// Supabase sync: one private document per authenticated user. Never embed a service_role key.
let cloud=null, cloudUser=null, cloudLoaded=false, cloudTimer=null, cloudSaving=false, cloudPending=false;
const cfgKey='presbyterium_supabase_config';
const syncBar=()=>document.getElementById('syncBar');
function syncState(message){syncBar().firstChild?.remove();syncBar().prepend(document.createTextNode(message+' '))}
const defaultCloudConfig={url:'https://lftlyywrxnanzpzrlgns.supabase.co',anon:'sb_publishable_9oD5s-WWfuIu-ebQ-ziVVQ_DWam-3D_'};
function config(){try{return {...defaultCloudConfig,...JSON.parse(localStorage.getItem(cfgKey)||'{}')}}catch{return {...defaultCloudConfig}}}
function showAuth(message=''){
 document.body.classList.add('locked');
 const c=config();
 document.getElementById('authArea').innerHTML=`<h2>Ασφαλής σύνδεση</h2><p>${esc(message||'Σύνδεσε το δικό σου Supabase project. Χρησιμοποίησε μόνο το publishable / anon key.')}</p><form onsubmit="return configureCloud(this)"><label>Project URL<input name="url" type="url" required placeholder="https://xxxx.supabase.co" value="${esc(c.url||'')}"></label><label>Publishable / anon key<input name="anon" required value="${esc(c.anon||'')}"></label><button class="primary">Αποθήκευση ρυθμίσεων</button></form><form onsubmit="return loginCloud(this)"><label>Email<input type="email" name="email" required></label><label>Κωδικός<input type="password" name="password" required minlength="8"></label><button class="primary">Σύνδεση</button><button type="button" onclick="registerCloud(this.form)">Δημιουργία λογαριασμού</button></form><p class="muted">Αν έχεις δεδομένα από παλαιότερη έκδοση, δεν μεταφέρονται αυτόματα. Μετά τη σύνδεση μπορείς να επιλέξεις εισαγωγή τοπικών δεδομένων.</p>`;
 syncState('Απαιτείται σύνδεση');
}
function configureCloud(form){
 const d=new FormData(form), url=String(d.get('url')).trim().replace(/\/$/,'');const anon=String(d.get('anon')).trim();
 if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)){alert('Δώσε έγκυρο Supabase Project URL.');return false}
 localStorage.setItem(cfgKey,JSON.stringify({url,anon}));initializeCloud();return false;
}
function createClient(){const c=config();if(!c.url||!c.anon||!window.supabase)return null;return window.supabase.createClient(c.url,c.anon,{auth:{persistSession:true,autoRefreshToken:true}})}
async function initializeCloud(){
 cloud=createClient();cloudLoaded=false;cloudUser=null;
 if(!cloud){showAuth('Συμπλήρωσε URL και publishable / anon key.');return}
 try{const {data,error}=await cloud.auth.getUser();if(error)throw error;if(!data.user){showAuth();return}await loadCloud(data.user)}catch(e){showAuth('Δεν ήταν δυνατή η σύνδεση: '+e.message)}
}
async function loginCloud(form){
 if(!cloud){alert('Αποθήκευσε πρώτα τις ρυθμίσεις Supabase.');return false}
 const d=new FormData(form);const {data,error}=await cloud.auth.signInWithPassword({email:d.get('email'),password:d.get('password')});
 if(error){alert(error.message);return false}await loadCloud(data.user);return false;
}
async function registerCloud(form){
 if(!cloud){alert('Αποθήκευσε πρώτα τις ρυθμίσεις Supabase.');return}
 const d=new FormData(form);const {error}=await cloud.auth.signUp({email:d.get('email'),password:d.get('password')});
 alert(error?error.message:'Ο λογαριασμός δημιουργήθηκε. Αν απαιτείται επιβεβαίωση email, άνοιξε το μήνυμα επιβεβαίωσης και συνδέσου.');
}
async function loadCloud(user){
 const {data,error}=await cloud.from('user_workspaces').select('payload').eq('user_id',user.id).maybeSingle();
 if(error){showAuth('Αποτυχία φόρτωσης: '+error.message+' — έλεγξε αν εκτέλεσες το schema.sql.');return}
 cloudUser=user;cloudLoaded=true;
 const localCopy=JSON.parse(localStorage.getItem(key)||'null');
 const hasLocal=localCopy&&['meetings','tasks','visits','announcements','committeeTopics','committeeSchedules'].some(k=>Array.isArray(localCopy[k])&&localCopy[k].length);
 if(data?.payload){db=data.payload;localStorage.setItem(key,JSON.stringify(db))}
 else{db={meetings:[],tasks:[],visits:[],announcements:[],committeeTopics:[],committeeSchedules:[],links:{deadlines:'',publicTalks:'https://publictalks.onrender.com/'}}}
 document.body.classList.remove('locked');document.getElementById('authArea').innerHTML='';
 syncBar().innerHTML=`<span id="syncStatus">Συνδεδεμένο</span> <button onclick="signOutCloud()">Αποσύνδεση</button> <button onclick="uploadLegacy()">Εισαγωγή τοπικών δεδομένων</button>`;
 window.legacyCopy=hasLocal?localCopy:null;
 if(!data?.payload)await writeCloud();
 render();
}
async function uploadLegacy(){
 if(!window.legacyCopy){alert('Δεν εντοπίστηκε παλαιό τοπικό αντίγραφο. Μπορείς να χρησιμοποιήσεις Εισαγωγή JSON από τις Αναφορές.');return}
 if(!confirm('Αντικατάσταση των δεδομένων στο Supabase με το παλιό τοπικό αντίγραφο;'))return;
 db=window.legacyCopy;save();render();
}
function queueCloudSave(){
 if(!cloudLoaded||!cloudUser)return;
 cloudPending=true;syncState('Εκκρεμεί συγχρονισμός');clearTimeout(cloudTimer);
 cloudTimer=setTimeout(writeCloud,450);
}
async function writeCloud(){
 if(!cloudLoaded||!cloudUser)return;
 if(cloudSaving){cloudPending=true;return}
 cloudSaving=true;cloudPending=false;const snapshot=JSON.stringify(db);syncState('Αποθήκευση...');
 const {error}=await cloud.from('user_workspaces').upsert({user_id:cloudUser.id,payload:JSON.parse(snapshot),updated_at:new Date().toISOString()},{onConflict:'user_id'});
 cloudSaving=false;
 if(error){syncState('Σφάλμα συγχρονισμού: '+error.message+' — διατήρησε αντίγραφο JSON');return}
 syncState('Αποθηκεύτηκε στο Supabase');
 if(cloudPending||JSON.stringify(db)!==snapshot){cloudPending=false;writeCloud()}
}
async function signOutCloud(){
 if(cloudSaving||cloudPending){alert('Περίμενε να ολοκληρωθεί η αποθήκευση.');return}
 await cloud.auth.signOut();cloudLoaded=false;cloudUser=null;db={meetings:[],tasks:[],visits:[],announcements:[],committeeTopics:[],committeeSchedules:[]};localStorage.removeItem(key);showAuth('Αποσυνδέθηκες.');
}

initializeCloud();</script></body></html>
